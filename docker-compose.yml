services:
  # ----------------ALTYAPI (Infrastructure)----------------

  postgres-db:
    image: postgres:latest
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - "POSTGRES_DB=CatalogDb"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis-db:
    image: redis:alpine
    container_name: ecommerce-redis
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "6379:6379"
    networks:
      - ecommerce-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "15672:15672" # Yönetim Paneli
      - "5672:5672" # Mesajlaşma Portu
    networks:
      - ecommerce-network

  # ----------------MİKROSERVİSLER (APIs)----------------

  identity.api:
    build:
      context: .
      dockerfile: src/Services/Identity.API/Dockerfile
    container_name: identity-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Docker içinde Postgres'e 'localhost' diyemeyiz, 'postgres-db' demeliyiz
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=IdentityDb;User Id=postgres;Password=postgres;
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5001:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ecommerce-network

  catalog.api:
    build:
      context: .
      dockerfile: src/Services/Catalog.API/Dockerfile
    container_name: catalog-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;
      - RabbitMQ__HostName=rabbitmq
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5002:8080"
    volumes:
      # Yuklenen urun gorselleri container yeniden olusturulunca kaybolmasin
      - catalog_uploads:/app/wwwroot/uploads
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - ecommerce-network

  basket.api:
    build:
      context: .
      dockerfile: src/Services/Basket.API/Dockerfile
    container_name: basket-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis-db:6379
      # Basket API, Catalog API ile konuşurken servis ismini kullanmalı!
      - Services__CatalogApi=http://catalog-api:8080
      - Services__PromotionApi=http://promotion-api:8080
      - Services__ShippingApi=http://shipping-api:8080
      - RabbitMQ__HostName=rabbitmq
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5038:8080"
    depends_on:
      - redis-db
      - rabbitmq
      - catalog.api
    networks:
      - ecommerce-network

  order.api:
    build:
      context: .
      dockerfile: src/Services/Order.API/Dockerfile
    container_name: order-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=OrderDb;User Id=postgres;Password=postgres;
      - RabbitMQ__HostName=rabbitmq
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5059:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - ecommerce-network

  promotion.api:
    build:
      context: .
      dockerfile: src/Services/Promotion.API/Dockerfile
    container_name: promotion-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=PromotionDb;User Id=postgres;Password=postgres;
    ports:
      - "5070:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ecommerce-network

  shipping.api:
    build:
      context: .
      dockerfile: src/Services/Shipping.API/Dockerfile
    container_name: shipping-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=ShippingDb;User Id=postgres;Password=postgres;
    ports:
      - "5071:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - ecommerce-network

  payment.api:
    build:
      context: .
      dockerfile: src/Services/Payment.API/Dockerfile
    container_name: payment-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__HostName=rabbitmq
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5277:8080"
    depends_on:
      - rabbitmq
    networks:
      - ecommerce-network

  # Gelistirme icin sahte SMTP sunucusu. Gonderilen tum e-postalar
  # http://localhost:8025 adresindeki arayuzde gorulur, disariya cikmaz.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecommerce-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ecommerce-network

  notification.api:
    build:
      context: .
      dockerfile: src/Services/Notification.API/Dockerfile
    container_name: notification-api
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__HostName=rabbitmq
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
      - Smtp__Host=mailhog
      - Smtp__Port=1025
      - ConnectionStrings__DefaultConnection=Server=postgres-db;Port=5432;Database=NotificationDb;User Id=postgres;Password=postgres;
    ports:
      - "5300:8080"
    depends_on:
      - rabbitmq
      - mailhog
      - postgres-db
    networks:
      - ecommerce-network

  shopping.aggregator:
    build:
      context: .
      dockerfile: src/Shopping.Aggregator/Dockerfile
    container_name: shopping-aggregator
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Services__OrderApi=http://order-api:8080
      - Services__CatalogApi=http://catalog-api:8080
      - Services__IdentityApi=http://identity-api:8080
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
    ports:
      - "5100:8080"
    depends_on:
      - identity.api
      - catalog.api
      - order.api
    networks:
      - ecommerce-network

  api.gateway:
    build:
      context: .
      dockerfile: src/API.Gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Identity__Url=http://identity-api:8080
      - OpenTelemetry__Endpoint=http://ecommerce-jaeger:4317
      # appsettings.Development.json localhost'a isaret ediyor (host'ta dotnet run icin).
      # Container icinde servis isimleriyle ezilmeli.
      - ReverseProxy__Clusters__aggregator-cluster__Destinations__aggregator__Address=http://shopping-aggregator:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__catalog__Address=http://catalog-api:8080
      - ReverseProxy__Clusters__basket-cluster__Destinations__basket__Address=http://basket-api:8080
      - ReverseProxy__Clusters__order-cluster__Destinations__order__Address=http://order-api:8080
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity__Address=http://identity-api:8080
      - ReverseProxy__Clusters__promotion-cluster__Destinations__promotion__Address=http://promotion-api:8080
      - ReverseProxy__Clusters__shipping-cluster__Destinations__shipping__Address=http://shipping-api:8080
    ports:
      # Host 8000 baska bir surec tarafindan tutulabiliyor; 8001 kullan
      - "8001:8080"
    depends_on:
      - identity.api
      - catalog.api
      - basket.api
      - order.api
      - shopping.aggregator
    networks:
      - ecommerce-network

      # ... Diğer servislerin altı ...

  ecommerce.web:
    build:
      context: ./src/Clients/ecommerce-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:8001}
        NEXT_PUBLIC_SIGNALR_URL: ${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:5059}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: ecommerce-web
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 90s
    environment:
      - NODE_ENV=production
      # Tarayıcıdan API/görsel URL'i (.env ile tek domain yönet)
      # Prod örnek: NEXT_PUBLIC_API_GATEWAY_URL=https://eticaret.example.com/gateway
      #             NEXT_PUBLIC_SIGNALR_URL=https://eticaret.example.com
      - NEXT_PUBLIC_API_GATEWAY_URL=${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:8001}
      - NEXT_PUBLIC_SIGNALR_URL=${NEXT_PUBLIC_SIGNALR_URL:-http://localhost:5059}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # SSR fetch'ler container içinden gateway'e gider
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://api-gateway:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api.gateway
    networks:
      - ecommerce-network

  # Yönetim paneli — http://localhost:3002 (3001 Grafana monitoring profiline ayrıldı)
  # Prod: nginx ile admin.DOMAIN altına alınır
  admin.panel:
    build:
      context: ./src/admin-panel
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${ADMIN_NEXT_PUBLIC_API_URL:-http://localhost:8001/aggregator/admin}
        NEXT_PUBLIC_AUTH_URL: ${ADMIN_NEXT_PUBLIC_AUTH_URL:-http://localhost:8001/auth}
        NEXT_PUBLIC_MEDIA_URL: ${ADMIN_NEXT_PUBLIC_MEDIA_URL:-http://localhost:8001/media}
        NEXT_PUBLIC_CATALOG_ADMIN_URL: ${ADMIN_NEXT_PUBLIC_CATALOG_ADMIN_URL:-http://localhost:8001/catalog/admin}
        NEXT_PUBLIC_PROMOTION_URL: ${ADMIN_NEXT_PUBLIC_PROMOTION_URL:-http://localhost:8001/promotions/admin}
        NEXT_PUBLIC_SHIPPING_URL: ${ADMIN_NEXT_PUBLIC_SHIPPING_URL:-http://localhost:8001/shipping/admin}
    container_name: ecommerce-admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/admin/login || wget -q -O /dev/null http://127.0.0.1:3000/admin/login || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      # Sadece localhost — dışarıdan IP:3002 ile erişim yok; nginx /admin üzerinden
      - "127.0.0.1:3002:3000"
    depends_on:
      - api.gateway
    networks:
      - ecommerce-network

  # Profiling: sadece `docker compose --profile monitoring up` veya
  # `./scripts/start-docker.sh --full` ile baslar. Gunluk gelistirmede RAM tasarrufu.
  seq:
    image: datalust/seq:latest
    container_name: ecommerce-seq
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=kRd4gGetLSybzd6
    ports:
      - "5340:80"
      - "5341:5341"
    networks:
      - ecommerce-network

  # ----------------DISTRIBUTED TRACING (Jaeger)----------------

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ecommerce-jaeger
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - ecommerce-network

  # ----------------MONİTORİNG (Prometheus & Grafana)----------------

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network
    depends_on:
      - catalog.api
      - basket.api
      - order.api
      - payment.api
      - identity.api

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - ecommerce-network
    depends_on:
      - prometheus


  # Unhealthy container'lari otomatik restart eder (healthcheck gerekir)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ecommerce-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=20
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ecommerce-network

  # Docker / konteyner izleme paneli (Portainer CE)
  # Erisim: https://VPS_IP:9443
  # Admin sifresi sunucuda: /root/.portainer_admin_password
  # Not: Ilk kurulumda admin API/UI ile olusturulur; sifre sifirlamak icin:
  #   docker stop ecommerce-portainer
  #   docker run --rm -v ecommerce_portainer_data:/data portainer/helper-reset-password
  #   docker start ecommerce-portainer
  portainer:
    image: portainer/portainer-ce:lts
    container_name: ecommerce-portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "9443:9443"
    networks:
      - ecommerce-network

volumes:
  postgres_data:
  grafana_data:
  catalog_uploads:
  portainer_data:

networks:
  ecommerce-network:
    driver: bridge

