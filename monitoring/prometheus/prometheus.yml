global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /metrics

  - job_name: 'catalog-api'
    static_configs:
      - targets: ['catalog-api:8080']
    metrics_path: /metrics

  - job_name: 'basket-api'
    static_configs:
      - targets: ['basket-api:8080']
    metrics_path: /metrics

  - job_name: 'order-api'
    static_configs:
      - targets: ['order-api:8080']
    metrics_path: /metrics

  - job_name: 'payment-api'
    static_configs:
      - targets: ['payment-api:8080']
    metrics_path: /metrics

  - job_name: 'identity-api'
    static_configs:
      - targets: ['identity-api:8080']
    metrics_path: /metrics

  - job_name: 'shopping-aggregator'
    static_configs:
      - targets: ['shopping-aggregator:8080']
    metrics_path: /metrics
