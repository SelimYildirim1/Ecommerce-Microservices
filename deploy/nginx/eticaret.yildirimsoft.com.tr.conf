# Storefront + API Gateway + Admin Panel
# Magaza : https://DOMAIN/
# Admin  : https://DOMAIN/admin/login  |  https://DOMAIN/admin/dashboard
# API/img: https://DOMAIN/gateway/...
# SignalR: https://DOMAIN/hubs/...
#
# .env (storefront):
#   NEXT_PUBLIC_API_GATEWAY_URL=https://DOMAIN/gateway
#   NEXT_PUBLIC_SIGNALR_URL=https://DOMAIN
#   NEXT_PUBLIC_SITE_URL=https://DOMAIN
#   INTERNAL_API_URL=http://api-gateway:8080
#
# .env (admin panel build args):
#   ADMIN_NEXT_PUBLIC_API_URL=https://DOMAIN/gateway/aggregator/admin
#   ADMIN_NEXT_PUBLIC_AUTH_URL=https://DOMAIN/gateway/auth
#   ADMIN_NEXT_PUBLIC_MEDIA_URL=https://DOMAIN/gateway/media
#   ADMIN_NEXT_PUBLIC_CATALOG_ADMIN_URL=https://DOMAIN/gateway/catalog/admin
#   ADMIN_NEXT_PUBLIC_PROMOTION_URL=https://DOMAIN/gateway/promotions/admin
#   ADMIN_NEXT_PUBLIC_SHIPPING_URL=https://DOMAIN/gateway/shipping/admin
#
# SMTP (Identity / bildirimler):
#   Smtp__Host, Smtp__Port, Smtp__User, Smtp__Password, Smtp__From, Smtp__Enabled=true
#   Geliştirmede MailHog (1025/8025) kullanılır; üretimde gerçek SMTP açın.
#
# Ödeme:
#   Payment.API şu an mock/simülasyon. Gerçek PSP (iyzico, PayTR, Stripe)
#   bağlandığında kart verisi storefront'ta toplanmaz; hosted form / 3D Secure
#   redirect akışı tercih edilmelidir.

upstream ecommerce_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream ecommerce_admin {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream ecommerce_gateway {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream ecommerce_order {
    server 127.0.0.1:5059;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name eticaret.yildirimsoft.com.tr;

    client_max_body_size 25m;

    # Güvenlik başlıkları (HTTPS sunucu bloğunda da tekrarlanır / Certbot sonrası canlıda eklenir)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /gateway/ {

    # Geçici backend hatalarında yeniden dene / hızlı fail
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
        proxy_pass http://ecommerce_gateway/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /hubs/ {
        proxy_pass http://ecommerce_order/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Admin panel (Next.js basePath=/admin) — path korunur
    location /admin {
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        proxy_pass http://ecommerce_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {

    # Geçici backend hatalarında yeniden dene / hızlı fail
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
        proxy_pass http://ecommerce_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
