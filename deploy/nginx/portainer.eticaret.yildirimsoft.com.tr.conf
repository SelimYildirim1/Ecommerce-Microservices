# Portainer — Docker izleme paneli
# DNS: portainer.eticaret.yildirimsoft.com.tr → VPS IP
# TLS: certbot --nginx -d portainer.eticaret.yildirimsoft.com.tr
#
# Alternatif (DNS yokken): https://VPS_IP:9443  (Portainer kendi sertifikasi)

upstream ecommerce_portainer {
    server 127.0.0.1:9000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name portainer.eticaret.yildirimsoft.com.tr;

    client_max_body_size 50m;

    location / {
        proxy_pass http://ecommerce_portainer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
