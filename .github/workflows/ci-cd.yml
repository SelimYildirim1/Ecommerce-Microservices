# =============================================================
#  E-Commerce Mikroservis CI/CD Pipeline
# =============================================================
# Tetiklenme: main branch'e push veya PR açıldığında
# Adımlar: Test → Build → Push Image → Deploy (ArgoCD)
# =============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  # ==================== 1. TEST ====================
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: .NET SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: NuGet paketlerini restore et
        run: dotnet restore Ecommerce.slnx

      - name: Build et
        run: dotnet build Ecommerce.slnx --no-restore --configuration Release

      - name: Testleri çalıştır
        run: dotnet test Ecommerce.slnx --no-build --configuration Release --verbosity normal

  # ==================== 2. BUILD & PUSH ====================
  build-and-push:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: test  # Test başarılı olmalı
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: identity-api
            dockerfile: src/Services/Identity.API/Dockerfile
            context: .
          - name: catalog-api
            dockerfile: src/Services/Catalog.API/Dockerfile
            context: .
          - name: basket-api
            dockerfile: src/Services/Basket.API/Dockerfile
            context: .
          - name: order-api
            dockerfile: src/Services/Order.API/Dockerfile
            context: .
          - name: payment-api
            dockerfile: src/Services/Payment.API/Dockerfile
            context: .
          - name: api-gateway
            dockerfile: src/API.Gateway/Dockerfile
            context: .
          - name: ecommerce-web
            dockerfile: src/Clients/ecommerce-web/Dockerfile
            context: src/Clients/ecommerce-web

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: GitHub Container Registry'ye giriş yap
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx kur (cache için)
        uses: docker/setup-buildx-action@v3

      - name: "${{ matrix.service.name }} imajını build & push et"
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 3. K8S MANIFEST GÜNCELLE ====================
  update-manifests:
    name: "📦 K8s Manifest Güncelle"
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write

    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag'lerini güncelle
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "Yeni image tag: $SHORT_SHA"

          # Backend manifest'teki image'ları güncelle
          sed -i "s|image: identity-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/identity-api:${{ github.sha }}|g" k8s/apps-backend.yaml
          sed -i "s|image: catalog-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/catalog-api:${{ github.sha }}|g" k8s/apps-backend.yaml
          sed -i "s|image: basket-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/basket-api:${{ github.sha }}|g" k8s/apps-backend.yaml
          sed -i "s|image: order-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/order-api:${{ github.sha }}|g" k8s/apps-backend.yaml
          sed -i "s|image: payment-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/payment-api:${{ github.sha }}|g" k8s/apps-backend.yaml
          sed -i "s|image: api-gateway:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ github.sha }}|g" k8s/apps-backend.yaml

          # Frontend manifest'teki image'ı güncelle
          sed -i "s|image: ecommerce-web:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/ecommerce-web:${{ github.sha }}|g" k8s/apps-frontend.yaml

          # imagePullPolicy'yi güncelle (Never -> Always, registry'den çekecek)
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" k8s/apps-backend.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: Always|g" k8s/apps-frontend.yaml

      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet || git commit -m "ci: image tag güncellendi → $(echo ${{ github.sha }} | cut -c1-7)"
          git push
