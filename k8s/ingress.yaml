      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-seq
                port:
                  number: 80

---
# =============================================================
#  5) RABBITMQ INGRESS - Mesaj Kuyruğu Yönetim Paneli
# =============================================================
# rabbitmq.e-commerce.local -> RabbitMQ Management UI (guest/guest)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-rabbitmq-ingress
  namespace: ecommerce
  labels:
    app: ecommerce-ingress
    tier: networking
spec:
  ingressClassName: nginx
  rules:
    - host: rabbitmq.e-commerce.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672

---
