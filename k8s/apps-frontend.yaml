# =============================================================
#  E-COMMERCE KUBERNETES - FRONTEND (Next.js)
# =============================================================
# Frontend uygulaması production modda çalışır (npm start).
# API Gateway'e erişim port-forward ile sağlanır:
#   kubectl port-forward svc/api-gateway 8000:8080 -n ecommerce
#
# Bu sayede frontend'deki http://localhost:8000 adresleri
# doğrudan Kubernetes'teki API Gateway'e yönlendirilir.
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-web
  namespace: ecommerce
  labels:
    app: ecommerce-web
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-web
  template:
    metadata:
      labels:
        app: ecommerce-web
        tier: frontend
    spec:
      containers:
        - name: ecommerce-web
          image: ghcr.io/selimyildirim1/ecommerce/ecommerce-web:9b7c00f3a2e01c8ebb47fb777014deda3b678267
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            # SSR (Server-Side Rendering) için K8s internal URL
            # Client-side URL'ler build sırasında baked-in olur (Dockerfile ARG)
            - name: INTERNAL_API_URL
              value: "http://api-gateway:8080"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-web
  namespace: ecommerce
  labels:
    app: ecommerce-web
spec:
  selector:
    app: ecommerce-web
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
