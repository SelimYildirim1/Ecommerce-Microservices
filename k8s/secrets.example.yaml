# Örnek K8s Secret — gerçek değerlerle uygulayın:
#   kubectl -n ecommerce create secret generic ecommerce-secrets \
#     --from-literal=jwt-secret='...' \
#     --from-literal=postgres-password='...' \
#     --from-literal=admin-password='...'
#
# Bu dosya örnek şablondur; gerçek secret YAML commit etmeyin.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_min_32_chars_long_secret_key!!"
  postgres-password: "CHANGE_ME"
  admin-password: "CHANGE_ME_StrongPass1!"
  rabbitmq-password: "CHANGE_ME"
