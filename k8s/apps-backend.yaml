# =============================================================
#  E-COMMERCE KUBERNETES - BACKEND SERVİSLERİ
# =============================================================
# Bu dosya tüm backend mikroservislerini içerir:
#   - Identity.API   (Kimlik Doğrulama / JWT)
#   - Catalog.API    (Ürün Kataloğu)
#   - Basket.API     (Alışveriş Sepeti)
#   - Order.API      (Sipariş Yönetimi)
#   - Payment.API    (Ödeme İşlemleri)
#   - API.Gateway    (Ocelot API Geçidi)
#
# ÖNEMLİ:
#   - imagePullPolicy: Never -> Lokalde build edilen imajları kullanır
#   - Servis isimleri ocelot.json ve docker-compose ile uyumludur
#   - Connection string'ler K8s servis isimlerini kullanır
# =============================================================

# =============================================================
#  IDENTITY API (Kimlik Doğrulama)
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: ecommerce
  labels:
    app: identity-api
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-api
  template:
    metadata:
      labels:
        app: identity-api
        tier: backend
    spec:
      containers:
        - name: identity-api
          image: identity-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Development"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=postgres-db;Port=5432;Database=IdentityDb;User Id=postgres;Password=postgres;"
            - name: RabbitMQ__HostName
              value: "rabbitmq"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: ecommerce
  labels:
    app: identity-api
spec:
  selector:
    app: identity-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

